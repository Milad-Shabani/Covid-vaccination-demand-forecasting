<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malard Vaccination Network — Operations Dashboard</title>
<script>__CHARTJS__</script>
<style>
  :root{
    --ink:#0B2545; --ink-soft:#33465F; --line:#E2E8F0; --panel:#F5F8FA; --paper:#FFFFFF;
    --accent:#0E7C86; --accent-soft:#E1F3F1;
    --blue:#2F6FED; --blue-soft:#E8EFFE;
    --gold:#C98A2C; --gold-soft:#FBF1E0;
    --red:#C0392B; --red-soft:#FBEAE8;
    --muted:#72839C;
    --shadow: 0 1px 2px rgba(11,37,69,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink-soft);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; font-size:14px;}
  h1,h2,h3,.num{font-family:'Manrope',system-ui,sans-serif;}
  .app{display:flex; min-height:100vh;}

  .sidebar{width:252px; flex-shrink:0; background:var(--ink); color:#DCE6F2; position:sticky; top:0; height:100vh; overflow-y:auto; padding:22px 14px;}
  .brand{padding:4px 10px 20px 10px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:14px;}
  .brand .mark{font-family:'Manrope',sans-serif; font-weight:800; font-size:15px; color:#fff;}
  .brand .sub{font-size:11px; color:#8CA3C2; margin-top:4px; line-height:1.5;}
  .nav-item{display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:7px; cursor:pointer; font-size:13px; color:#B9CBE2; margin-bottom:1px;}
  .nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .nav-item.active{background:var(--accent); color:#fff; font-weight:600;}
  .nav-dot{width:5px; height:5px; border-radius:50%; background:currentColor; opacity:0.55; flex-shrink:0;}

  .main{flex:1; min-width:0;}
  .topbar{position:sticky; top:0; z-index:5; background:rgba(255,255,255,0.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line); padding:14px 28px;}
  .topbar h1{font-size:18px; margin:0; color:var(--ink); font-weight:700;}
  .topbar .subtitle{font-size:12px; color:var(--muted); margin-top:2px;}
  .disclaimer{background:var(--gold-soft); border-bottom:1px solid #EFDBAE; color:#6B4E14; font-size:11.5px; padding:7px 28px; text-align:center;}

  .content{padding:26px 28px 60px;}
  .section{display:none;}
  .section.active{display:block;}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px; margin-bottom:22px;}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
  .kpi .label{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px;}
  .kpi .num{font-size:20px; font-weight:800; color:var(--ink);}
  .kpi.accent{background:var(--accent-soft);} .kpi.accent .num{color:var(--accent);}
  .kpi.blue{background:var(--blue-soft);} .kpi.blue .num{color:var(--blue);}
  .kpi.gold{background:var(--gold-soft);} .kpi.gold .num{color:#8A611E;}
  .kpi.red{background:var(--red-soft);} .kpi.red .num{color:var(--red);}

  .grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:16px; margin-bottom:16px;}
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:16px;}
  @media (max-width: 900px){ .grid-2,.grid-3{grid-template-columns:1fr;} }

  .card{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:16px 18px; box-shadow:var(--shadow);}
  .card h3{font-size:13px; margin:0 0 12px; color:var(--ink); font-weight:700;}
  .card .chart-wrap{position:relative; height:250px;}
  .card .chart-wrap.tall{height:320px;}
  .card .chart-wrap.short{height:190px;}
  .card img.report-fig{width:100%; height:auto; border-radius:6px; border:1px solid var(--line);}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line);}
  td{padding:8px 10px; border-bottom:1px solid #F0F3F7; color:var(--ink-soft);}
  tr:last-child td{border-bottom:none;}
  .tag{display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:600;}
  .tag.mild{background:var(--accent-soft); color:var(--accent);}
  .tag.mod{background:var(--gold-soft); color:#8A611E;}
  .tag.serious{background:var(--red-soft); color:var(--red);}

  .insight-list{list-style:none; margin:0; padding:0;}
  .insight-list li{padding:9px 0; border-bottom:1px solid #F0F3F7; font-size:12.5px; line-height:1.5; padding-left:16px; position:relative;}
  .insight-list li:before{content:"—"; position:absolute; left:0; color:var(--accent); font-weight:700;}
  .insight-list li:last-child{border-bottom:none;}

  .footer-author{margin-top:40px; border-top:1px solid var(--line); padding-top:28px; display:flex; align-items:center; gap:18px;}
  .footer-author img{width:64px; height:64px; border-radius:50%; object-fit:cover; border:1px solid var(--line);}
  .footer-author .name{font-weight:800; color:var(--ink); font-size:15px;}
  .footer-author .role{font-size:12px; color:var(--muted); margin-top:2px;}
  .footer-author .links a{color:var(--accent); text-decoration:none; margin-right:14px; font-weight:600; font-size:12px;}

  @media (max-width: 760px){
    .topbar{padding:12px 16px;} .content{padding:16px;}
  }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark">Malard Vaccination Network</div>
      <div class="sub">Operations &amp; Demand Forecasting Dashboard</div>
    </div>
    <div id="nav-list"></div>
  </nav>

  <div class="main">
    <div class="disclaimer">Synthetic modeled data for a portfolio project — not an official public-health record. See docs/data_dictionary.md.</div>
    <div class="topbar">
      <h1 id="section-title">Overview</h1>
      <div class="subtitle" id="section-subtitle">Network-wide campaign summary</div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
const DASHBOARD_DATA = __DASHBOARD_DATA__;
</script>
<script>__DASHBOARD_JS__</script>
</body>
</html>
