[project]
name = "covid-vaccination-demand-forecasting"
version = "1.0.0"
description = "Synthetic COVID-19 vaccination operations analytics & demand forecasting (SARIMA vs XGBoost) for a district health network"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Milad Shabani" }]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "jdatetime>=4.1",
    "statsmodels>=0.14",
    "pmdarima>=2.0",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyarrow>=14.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110
target-version = "py310"
